name: Daily fare scrape

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: scrape
        run: |
          run_id=$(python -m scraper.run)
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: raw-fares-${{ github.run_id }}
          path: data/raw/
      - run: python -c "from pipeline.clean import clean_run; clean_run('$RUN_ID')"
        env:
          RUN_ID: ${{ steps.scrape.outputs.run_id }}
      - run: python -m index.build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/cleaned data/index
          git diff --staged --quiet || git commit -m "chore: daily fare data $(date -u +%Y-%m-%d)"
          git pull --rebase
          git push
